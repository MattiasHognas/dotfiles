name: Check dotfiles
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install syntax checkers
        run: sudo apt-get update && sudo apt-get install -y fish shellcheck
      - name: Check scripts, profiles, and isolated recovery
        run: ./scripts/check.sh
